name: Retire merged branches once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/retire-merged-branches-once.yml'

permissions:
  contents: write

jobs:
  retire:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Delete retired branch refs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          branches=(
            'agent/neko32-gpt'
            'feat/earth-dead-signal-canon'
            'feat/earth-sector-atmosphere'
          )
          for branch in "${branches[@]}"; do
            ref="heads/$branch"
            status="$(curl -sS -o /tmp/delete-ref.json -w '%{http_code}' \
              -X DELETE \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/git/refs/$ref")"
            case "$status" in
              204|404) ;;
              *)
                cat /tmp/delete-ref.json >&2 || true
                echo "DELETE_REF_FAILED branch=$branch http=$status" >&2
                exit 1
                ;;
            esac
          done
          for branch in "${branches[@]}"; do
            if git ls-remote --exit-code --heads origin "refs/heads/$branch" >/dev/null 2>&1; then
              echo "RETIRED_BRANCH_STILL_EXISTS $branch" >&2
              exit 1
            fi
          done
          echo 'RETIRED_BRANCHES_DELETED'
