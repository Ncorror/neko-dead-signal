name: Retire historical NEKO branches (one-shot)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/retire-neko-branches-20261110.yml'
permissions:
  contents: write
jobs:
  cleanup:
    if: github.repository == 'Ncorror/neko-dead-signal'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Delete verified old branches, keep main and Astra
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const expected = {
              "agent/neko32-claude": "6a2fc2d6888a51a4cb4edc4543da53a853bb91f7",
              "art/commander-roster-v1": "1753c0db725126dc2bd2976cf03516335f0f5238",
              "baseline/rts-0.0.20-before-world": "e8872990b2a0e7abec491fc4c99119860a039210",
              "chore/neko-dead-signal-rebrand-v028": "8b10278845241459e21e727b2a70efd7ed63ce1e",
              "chore/neko-paths-and-branding-audit-029": "b9332eee31bb01a13048fe173bb1b97c8ed0f0ea",
              "docs/device019-victory-20261105": "740705dced1ea7f402ca4f00a13977a039b8bd4b",
              "feat/amina-static-landing-preview-v006": "35d28d7ca1c1736975fa1f2813ca746fdb5d8cbc",
              "feat/base-construction-v014": "a1d9ae860813cf056aed6133a20c000f5ee1d8c7",
              "feat/economy-power-objectives-v016": "23ac6c9dcea8e67668198d30b61f81528d851b42",
              "feat/first-landing-prototype": "933006bf91a9a928742b9c4977f40a3d1177a0c3",
              "feat/mobile-guardian-v012": "05a405f3582eee9764d5a1efc590b8b41e96fdbc",
              "feat/orbital-command-ui": "cd1e8814fd35d0630620c9f21ad3ef577d1c068d",
              "feat/orders-and-recon-v008": "43a6af8932b34ad6d483af67893602c0638e31c1",
              "feat/production-large-map-v010": "800c45636ae0c0f12e553f0f8465555d1f2f8e25",
              "feat/pure-rts-commanders": "7110dbb35d03ee86986b878a4fcae55ab29dc8cf",
              "feat/rts-formation-clearance-v006": "7173cb0dc466a17525f6466c7cc1ef12c2ae6617",
              "feat/rts-landing-skirmish": "eab7bca14548ed94bea71d72197b8fce86c8959f",
              "feat/rts-squads-grid-pathfinding": "0eb3e2c31388831e8a24a03bcb9afedaddb65f79",
              "feat/surface-128-v025": "2c203459c5a63547fe98421860d4d0ddd9f29bc3",
              "feat/surface-art-v026": "e7d4d693e36ef74a3e05f71f85fd2a0875658836",
              "feat/tester-diagnostics-3d-roster": "63b9c84402882e855f4afd7e9d6c56c152a380e9",
              "feat/world-assault-combat-v023": "750e1445bccf6d1040019adce317632cc1914cc3",
              "feat/world-pve-sector-v024": "2afbb930ab4734d31e09859214a367bae7a5ca44",
              "feat/world-zone-v021": "36e7d9f782b545702699d0cd9c3a0e58049cd583",
              "feature/female-base-v3-production": "3e9e3c50b020df788ecdf3e339b53f1c5d5468be",
              "fix/base-sight-radius-v018": "caf05e19be1cac9e81fa081a4545b05c1ddcfdf0",
              "fix/building-sight-touch-v017": "320f4a621bde9cd7ff9c6fe29056ae6148bf5d36",
              "fix/defeat-sight-report-v009": "6648bec07a21d2f4048bfd52e1ccb14ee490d8e4",
              "fix/embedded-result-layout-v009": "dbb75a3dc17aab8dee18e713f1ee413ddae1eb72",
              "fix/headquarters-sight-v019": "36f4cb0a9369e0015a1e590ec01b2ccf5ced4824",
              "fix/manual-preview-smooth-paths-v007": "fd24262778e7036672b20e1f7b955f4dd4ae970f",
              "fix/orbital-menu-touch-exit": "9236d69019456b96c1829bfee555961bf1d318d9",
              "fix/project-audit-v015": "1a236f78414ac66c696cdcff921b359f094405e4",
              "fix/return-fire-v013": "c97303e2b6000a9509f8468e3e6214d85519413d",
              "fix/selection-camera-and-portraits-v004": "f469a01b3786e394da48384ad683ac0442e8d112",
              "fix/smooth-minimap-v011": "7608b93a0bc310990162ad5caac404268aeafe4b",
              "fix/surface-presentation-v027": "c1b44efd11120b5acc5597b08521b339c9d88e5d",
              "fix/victory-building-labels-v020": "2fee1315eba147262d36fe02022f4523b32f7355",
              "fix/world-camera-logs-v022": "e9effd287179dcc1fce1509345b457f166d3f428",
              "infra/vienna-runner-server": "cb10369acd48bd32e821b9dfa04389f468a443c7"
            };
            const { owner, repo } = context.repo;
            if (owner !== 'Ncorror' || repo !== 'neko-dead-signal' || context.ref !== 'refs/heads/main') throw new Error('Wrong repo or ref');
            const parentMerge = await github.rest.git.getCommit({owner,repo,commit_sha:'2193d5f18277dc4c25e9d985019d378d7c75eaaa'});
            if (parentMerge.data.parents.length !== 38 || parentMerge.data.tree.sha !== '3e66098b250de2a29c8071d3fcaf51e7fab3d289') throw new Error('Historic merge verification failed');
            const mainRef = await github.rest.git.getRef({owner,repo,ref:'heads/main'});
            if (mainRef.data.object.sha !== context.sha) throw new Error('Main moved; abort cleanup');
            let deleted=0, skipped=0;
            for (const [branch, expectedSha] of Object.entries(expected)) {
              if (branch === 'main' || branch === 'agent/neko32-gpt') throw new Error('Protected branch in deletion set');
              const current = await github.rest.git.getRef({owner,repo,ref:'heads/'+branch});
              if (current.data.object.sha !== expectedSha) { core.warning('Branch changed, SKIP: '+branch); skipped++; continue; }
              await github.rest.git.deleteRef({owner,repo,ref:'heads/'+branch});
              core.info('DELETED '+branch+' '+expectedSha);
              deleted++;
            }
            core.info('BRANCH_CLEANUP_DONE deleted='+deleted+' skipped='+skipped);
            if (skipped) core.setFailed('Some refs changed since inventory; leave them intact');
