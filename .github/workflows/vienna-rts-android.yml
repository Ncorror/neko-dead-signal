name: Neko Dead Signal Android Debug

on:
  push:
    branches:
      - infra/vienna-runner-server
      - feat/orbital-command-ui
      - feat/pure-rts-commanders
      - main
      - feature/female-base-v3-production
      - chore/neko-dead-signal-rebrand-v028
      - fix/manual-preview-smooth-paths-v007
      - feat/orders-and-recon-v008
      - fix/defeat-sight-report-v009
      - fix/embedded-result-layout-v009
      - fix/headquarters-sight-v019
      - fix/victory-building-labels-v020
      - feat/world-zone-v021
      - fix/world-camera-logs-v022
      - feat/world-assault-combat-v023
      - feat/world-pve-sector-v024
      - feat/surface-128-v025
      - feat/surface-art-v026
      - fix/surface-presentation-v027
      - fix/base-sight-radius-v018
      - fix/building-sight-touch-v017
      - feat/economy-power-objectives-v016
      - fix/project-audit-v015
      - feat/base-construction-v014
      - fix/return-fire-v013
      - feat/mobile-guardian-v012
      - fix/smooth-minimap-v011
      - feat/production-large-map-v010
      - feat/rts-formation-clearance-v006
      - feat/amina-static-landing-preview-v006
      - feat/tester-diagnostics-3d-roster
      - feat/rts-squads-grid-pathfinding
      - feat/rts-landing-skirmish
      - fix/orbital-menu-touch-exit
      - fix/selection-camera-and-portraits-v004
    paths:
      - 'client/**'
      - 'tools/build_environment_kit.py'
      - '.github/workflows/vienna-rts-android.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reina-rts-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-debug:
    runs-on: [self-hosted, Linux, X64, reina-rts-ci]
    timeout-minutes: 40
    env:
      JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
      ANDROID_HOME: /opt/android-sdk
    steps:
      - uses: actions/checkout@v4
      - name: Verify local server API contract
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m unittest discover -s server -p 'test_*.py' -v

      - name: Test RTS input and commander contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m unittest discover -s scripts -p 'test_*.py' -v

      - name: Verify RTS toolchain
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$(godot --version)" == 4.7.2* ]]
          test -s "$HOME/.local/share/godot/export_templates/4.7.2.stable/android_debug.apk"
          test -x "$ANDROID_HOME/build-tools/36.1.0/apksigner"
          test -d "$ANDROID_HOME/platforms/android-36"
          java -version
      - name: Verify authored environment GLBs match their source
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 tools/build_environment_kit.py --check
      - name: Prepare writable Godot XDG directories
        shell: bash
        run: |
          set -Eeuo pipefail
          # Each workflow job uses isolated writable data/config/cache directories.
          # The system runner home may have root-owned intermediate directories
          # from first-time export template provisioning.
          DATA_DIR="$RUNNER_TEMP/reina-rts-xdg-data"
          CONFIG_DIR="$RUNNER_TEMP/reina-rts-xdg-config"
          CACHE_DIR="$RUNNER_TEMP/reina-rts-xdg-cache"
          mkdir -p "$DATA_DIR/godot" "$CONFIG_DIR" "$CACHE_DIR"
          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates"
          test -s "$TEMPLATE_DIR/4.7.2.stable/android_debug.apk"
          ln -s "$TEMPLATE_DIR" "$DATA_DIR/godot/export_templates"
          {
            echo "XDG_DATA_HOME=$DATA_DIR"
            echo "XDG_CONFIG_HOME=$CONFIG_DIR"
            echo "XDG_CACHE_HOME=$CACHE_DIR"
          } >> "$GITHUB_ENV"
          test -w "$DATA_DIR/godot"
      - name: Install exact Lyra Voss 20-clip model
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m venv "$RUNNER_TEMP/lyra-venv"
          "$RUNNER_TEMP/lyra-venv/bin/pip" -q install "gdown==5.2.0"
          "$RUNNER_TEMP/lyra-venv/bin/python" scripts/install_lyra_voss.py
          "$RUNNER_TEMP/lyra-venv/bin/python" scripts/install_lyra_voss_weapon.py
          python3 tools/avatar/validate_game_glb.py client/assets/characters/lyra_voss/rigged.glb --min-clips 20
      - name: Import and validate RTS project
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p build
          godot --headless --path client --editor --import --quit 2>&1 | tee build/godot-import.log
          godot --headless --path client res://scenes/world_zone.tscn --quit-after 2 2>&1 | tee build/world-smoke.log
          godot --headless --path client res://scenes/surface_sector_01_prototype.tscn --quit-after 2 2>&1 | tee build/surface-smoke.log
          if grep -Ei 'SCRIPT ERROR|Parse Error|ERROR:' build/godot-import.log build/world-smoke.log build/surface-smoke.log; then
            exit 1
          fi
      - name: Validate imported surface modules, materials, geometry and shared footprints
        shell: bash
        run: |
          set -Eeuo pipefail
          timeout 90s godot --headless --path client res://tests/test_surface_assets.tscn 2>&1 | tee build/rts-surface-assets-test.log
          grep -q 'SURFACE_ASSETS_TEST_PASS' build/rts-surface-assets-test.log
          if grep -Ei 'SCRIPT ERROR|Parse Error|ERROR:' build/rts-surface-assets-test.log; then
            exit 1
          fi
      - name: Test world profile checkpoints, one-time rewards and save recovery
        shell: bash
        run: |
          set -Eeuo pipefail
          timeout 45s godot --headless --path client res://tests/test_world_progress.tscn 2>&1 | tee build/rts-world-progress-test.log
          grep -q 'WORLD_PROGRESS_TEST_PASS' build/rts-world-progress-test.log
          if grep -Ei 'SCRIPT ERROR|Parse Error|ERROR:' build/rts-world-progress-test.log; then
            exit 1
          fi
      - name: Validate 128x128 terrain geometry and independent surface saves
        shell: bash
        run: |
          set -Eeuo pipefail
          timeout 90s godot --headless --path client res://tests/test_surface_terrain.tscn 2>&1 | tee build/rts-surface-terrain-test.log
          grep -q 'SURFACE_TERRAIN_TEST_PASS' build/rts-surface-terrain-test.log
          if grep -Ei 'SCRIPT ERROR|Parse Error|ERROR:' build/rts-surface-terrain-test.log; then
            exit 1
          fi
      - name: Walk all surface sites with real terrain picking and native Android gestures
        shell: bash
        run: |
          set -Eeuo pipefail
          timeout 150s godot --headless --path client res://tests/test_surface_sector.tscn 2>&1 | tee build/rts-surface-sector-test.log
          grep -q 'SURFACE_SECTOR_TEST_PASS' build/rts-surface-sector-test.log
          if grep -Ei 'SCRIPT ERROR|Parse Error|ERROR:' build/rts-surface-sector-test.log; then
            exit 1
          fi
      - name: Test Rust Road boss tells, immunity, leashes and respawn timers
        shell: bash
        run: |
          set -Eeuo pipefail
          timeout 60s godot --headless --path client res://tests/test_world_hunt.tscn 2>&1 | tee build/rts-world-hunt-test.log
          grep -q 'WORLD_HUNT_TEST_PASS' build/rts-world-hunt-test.log
          if grep -Ei 'SCRIPT ERROR|Parse Error|ERROR:' build/rts-world-hunt-test.log; then
            exit 1
          fi
      - name: Play native PvE travel, camps, boss and persistent reward
        shell: bash
        run: |
          set -Eeuo pipefail
          timeout 120s godot --headless --path client res://tests/test_world_sector.tscn 2>&1 | tee build/rts-world-sector-test.log
          grep -q 'WORLD_SECTOR_TEST_PASS' build/rts-world-sector-test.log
          if grep -Ei 'SCRIPT ERROR|Parse Error|ERROR:' build/rts-world-sector-test.log; then
            exit 1
          fi
      - name: Play the one-hero world quest and return to RTS
        shell: bash
        run: |
          set -Eeuo pipefail
          timeout 90s godot --headless --path client res://tests/test_world_zone.tscn 2>&1 | tee build/rts-world-zone-test.log
          grep -q 'WORLD_ZONE_TEST_PASS' build/rts-world-zone-test.log
          if grep -Ei 'SCRIPT ERROR|Parse Error|ERROR:' build/rts-world-zone-test.log; then
            exit 1
          fi
      - name: Test world touch gestures and native UI at three Android sizes
        shell: bash
        run: |
          set -Eeuo pipefail
          timeout 90s godot --headless --path client res://tests/test_world_input.tscn 2>&1 | tee build/rts-world-input-test.log
          grep -q 'WORLD_INPUT_TEST_PASS' build/rts-world-input-test.log
          if grep -Ei 'SCRIPT ERROR|Parse Error|ERROR:' build/rts-world-input-test.log; then
            exit 1
          fi
      - name: Test automatic world camera, walking speed and existing save migration
        shell: bash
        run: |
          set -Eeuo pipefail
          timeout 90s godot --headless --path client res://tests/test_world_camera.tscn 2>&1 | tee build/rts-world-camera-test.log
          grep -q 'WORLD_CAMERA_TEST_PASS' build/rts-world-camera-test.log
          if grep -Ei 'SCRIPT ERROR|Parse Error|ERROR:' build/rts-world-camera-test.log; then
            exit 1
          fi
      - name: Validate Assault PvE skill math, response fire, cover and cooldowns
        shell: bash
        run: |
          set -Eeuo pipefail
          timeout 120s godot --headless --path client res://tests/test_world_combat.tscn 2>&1 | tee build/rts-world-combat-test.log
          grep -q 'WORLD_COMBAT_TEST_PASS' build/rts-world-combat-test.log
          if grep -Ei 'SCRIPT ERROR|Parse Error|ERROR:' build/rts-world-combat-test.log; then
            exit 1
          fi
      - name: Play optional world combat quest, native skills, death and save reentry
        shell: bash
        run: |
          set -Eeuo pipefail
          timeout 120s godot --headless --path client res://tests/test_world_battle.tscn 2>&1 | tee build/rts-world-battle-test.log
          grep -q 'WORLD_BATTLE_TEST_PASS' build/rts-world-battle-test.log
          if grep -Ei 'SCRIPT ERROR|Parse Error|ERROR:' build/rts-world-battle-test.log; then
            exit 1
          fi
      - name: Test dense-base captions, power warnings and camera zooms
        shell: bash
        run: |
          set -Eeuo pipefail
          timeout 90s godot --headless --path client res://tests/test_building_labels.tscn 2>&1 | tee build/rts-building-labels-test.log
          grep -q 'RTS_BUILDING_LABELS_TEST_PASS' build/rts-building-labels-test.log
          if grep -Ei 'SCRIPT ERROR|Parse Error|ERROR:' build/rts-building-labels-test.log; then
            exit 1
          fi
      - name: Run AStar navigation regression in Godot
        shell: bash
        run: |
          set -Eeuo pipefail
          timeout 35s godot --headless --path client --script res://tests/test_rts_navigation.gd 2>&1 | tee build/rts-navigation-test.log
          grep -q 'RTS_NAV_TEST_PASS' build/rts-navigation-test.log
          if grep -Ei 'SCRIPT ERROR|Parse Error|ERROR:' build/rts-navigation-test.log; then
            exit 1
          fi
      - name: Test squad formation and allied clearance
        shell: bash
        run: |
          set -Eeuo pipefail
          timeout 40s godot --headless --path client res://tests/test_squad_movement.tscn 2>&1 | tee build/rts-squad-test.log
          grep -q 'RTS_SQUAD_TEST_PASS' build/rts-squad-test.log
          if grep -Ei 'SCRIPT ERROR|Parse Error|ERROR:' build/rts-squad-test.log; then
            exit 1
          fi
      - name: Test debug diagnostics JSONL and ZIP bundle
        shell: bash
        run: |
          set -Eeuo pipefail
          timeout 40s godot --headless --path client res://tests/test_diagnostics.tscn 2>&1 | tee build/rts-diagnostics-test.log
          grep -q 'RTS_DIAGNOSTICS_TEST_PASS' build/rts-diagnostics-test.log
          if grep -Ei 'SCRIPT ERROR|Parse Error|ERROR:' build/rts-diagnostics-test.log; then
            exit 1
          fi
      - name: Check visible menu layout and exit hitbox
        shell: bash
        run: |
          set -Eeuo pipefail
          timeout 40s godot --headless --path client res://tests/test_menu_layout.tscn 2>&1 | tee build/rts-menu-test.log
          grep -q 'RTS_MENU_TEST_PASS' build/rts-menu-test.log
          if grep -Ei 'SCRIPT ERROR|Parse Error|ERROR:' build/rts-menu-test.log; then
            exit 1
          fi
      - name: Validate imported Amina on orbital menu and RTS battlefield
        shell: bash
        run: |
          set -Eeuo pipefail
          timeout 45s godot --headless --path client res://tests/test_amina_visual.tscn 2>&1 | tee build/rts-amina-visual-test.log
          grep -q 'RTS_AMINA_VISUAL_TEST_PASS' build/rts-amina-visual-test.log
          if grep -Ei 'SCRIPT ERROR|Parse Error|ERROR:' build/rts-amina-visual-test.log; then
            exit 1
          fi
      - name: Test battlefield touch zoom and gesture cancellation
        shell: bash
        run: |
          set -Eeuo pipefail
          timeout 40s godot --headless --path client res://tests/test_camera_gestures.tscn 2>&1 | tee build/rts-camera-test.log
          grep -q 'RTS_CAMERA_TEST_PASS' build/rts-camera-test.log
          if grep -Ei 'SCRIPT ERROR|Parse Error|ERROR:' build/rts-camera-test.log; then
            exit 1
          fi
      - name: Play the landing regression in Godot
        shell: bash
        run: |
          set -Eeuo pipefail
          timeout 40s godot --headless --resolution 1280x720 --path client res://tests/test_landing.tscn 2>&1 | tee build/rts-landing-test.log
          grep -q 'RTS_LANDING_TEST_PASS' build/rts-landing-test.log
          if grep -Ei 'SCRIPT ERROR|Parse Error|ERROR:' build/rts-landing-test.log; then
            exit 1
          fi
      - name: Test queued movement, attack, stop and battlefield HUD
        shell: bash
        run: |
          set -Eeuo pipefail
          timeout 45s godot --headless --path client res://tests/test_order_queue.tscn 2>&1 | tee build/rts-queue-test.log
          grep -q 'RTS_QUEUE_TEST_PASS' build/rts-queue-test.log
          if grep -Ei 'SCRIPT ERROR|Parse Error|ERROR:' build/rts-queue-test.log; then
            exit 1
          fi
      - name: Test shared sight, cover, memory and hidden targets
        shell: bash
        run: |
          set -Eeuo pipefail
          timeout 40s godot --headless --path client res://tests/test_visibility.tscn 2>&1 | tee build/rts-visibility-test.log
          grep -q 'RTS_VISIBILITY_TEST_PASS' build/rts-visibility-test.log
          if grep -Ei 'SCRIPT ERROR|Parse Error|ERROR:' build/rts-visibility-test.log; then
            exit 1
          fi
      - name: Test return fire, fire on the move and manual mode
        shell: bash
        run: |
          set -Eeuo pipefail
          timeout 90s godot --headless --path client res://tests/test_auto_fire.tscn 2>&1 | tee build/rts-auto-fire-test.log
          grep -q 'RTS_AUTO_FIRE_TEST_PASS' build/rts-auto-fire-test.log
          if grep -Ei 'SCRIPT ERROR|Parse Error|ERROR:' build/rts-auto-fire-test.log; then
            exit 1
          fi
      - name: Test mobile guardian perception, chase, fog and attack queues
        shell: bash
        run: |
          set -Eeuo pipefail
          timeout 60s godot --headless --path client res://tests/test_enemy_ai.tscn 2>&1 | tee build/rts-enemy-test.log
          grep -q 'RTS_ENEMY_TEST_PASS' build/rts-enemy-test.log
          if grep -Ei 'SCRIPT ERROR|Parse Error|ERROR:' build/rts-enemy-test.log; then
            exit 1
          fi
      - name: Run 96 seeded group routes with orders and shared sight
        shell: bash
        run: |
          set -Eeuo pipefail
          timeout 60s godot --headless --path client res://tests/test_operation_stress.tscn 2>&1 | tee build/rts-stress-test.log
          grep -q 'RTS_STRESS_TEST_PASS' build/rts-stress-test.log
          if grep -Ei 'SCRIPT ERROR|Parse Error|ERROR:' build/rts-stress-test.log; then
            exit 1
          fi
      - name: Test last casualty, fog closure and visible operation results
        shell: bash
        run: |
          set -Eeuo pipefail
          timeout 45s godot --headless --path client res://tests/test_operation_result.tscn 2>&1 | tee build/rts-result-test.log
          grep -q 'RTS_RESULT_TEST_PASS' build/rts-result-test.log
          if grep -Ei 'SCRIPT ERROR|Parse Error|ERROR:' build/rts-result-test.log; then
            exit 1
          fi
      - name: Test building reveal ranges, power transitions and dense-base sight budget
        shell: bash
        run: |
          set -Eeuo pipefail
          timeout 90s godot --headless --path client res://tests/test_building_sight.tscn 2>&1 | tee build/rts-building-sight-test.log
          grep -q 'RTS_BUILDING_SIGHT_TEST_PASS' build/rts-building-sight-test.log
          if grep -Ei 'SCRIPT ERROR|Parse Error|ERROR:' build/rts-building-sight-test.log; then
            exit 1
          fi
      - name: Test owned building sight, narrow passage and native placement drag
        shell: bash
        run: |
          set -Eeuo pipefail
          timeout 90s godot --headless --path client res://tests/test_building_interaction.tscn 2>&1 | tee build/rts-building-interaction-test.log
          grep -q 'RTS_BUILDING_INTERACTION_TEST_PASS' build/rts-building-interaction-test.log
          if grep -Ei 'SCRIPT ERROR|Parse Error|ERROR:' build/rts-building-interaction-test.log; then
            exit 1
          fi
      - name: Test operation income, power allocation and paused production
        shell: bash
        run: |
          set -Eeuo pipefail
          timeout 90s godot --headless --path client res://tests/test_economy_power.tscn 2>&1 | tee build/rts-economy-power-test.log
          grep -q 'RTS_ECONOMY_TEST_PASS' build/rts-economy-power-test.log
          if grep -Ei 'SCRIPT ERROR|Parse Error|ERROR:' build/rts-economy-power-test.log; then
            exit 1
          fi
      - name: Test multiple targets, capture rewards and expanded mission goals
        shell: bash
        run: |
          set -Eeuo pipefail
          timeout 90s godot --headless --path client res://tests/test_extended_objectives.tscn 2>&1 | tee build/rts-extended-objectives-test.log
          grep -q 'RTS_OBJECTIVES_TEST_PASS' build/rts-extended-objectives-test.log
          if grep -Ei 'SCRIPT ERROR|Parse Error|ERROR:' build/rts-extended-objectives-test.log; then
            exit 1
          fi
      - name: Play the full expanded operation with normal income and damage
        shell: bash
        run: |
          set -Eeuo pipefail
          timeout 90s godot --headless --path client res://tests/test_extended_play.tscn 2>&1 | tee build/rts-extended-play-test.log
          grep -q 'RTS_EXTENDED_PLAY_TEST_PASS' build/rts-extended-play-test.log
          if grep -Ei 'SCRIPT ERROR|Parse Error|ERROR:' build/rts-extended-play-test.log; then
            exit 1
          fi
      - name: Test Android Back layers, cancellation and ship confirmation
        shell: bash
        run: |
          set -Eeuo pipefail
          timeout 60s godot --headless --path client res://tests/test_back_navigation.tscn 2>&1 | tee build/rts-back-test.log
          grep -q 'RTS_BACK_TEST_PASS' build/rts-back-test.log
          if grep -Ei 'SCRIPT ERROR|Parse Error|ERROR:' build/rts-back-test.log; then
            exit 1
          fi
      - name: Test paid construction, shared wallet, parallel factories and native placement
        shell: bash
        run: |
          set -Eeuo pipefail
          timeout 90s godot --headless --path client res://tests/test_construction.tscn 2>&1 | tee build/rts-construction-test.log
          grep -q 'RTS_CONSTRUCTION_TEST_PASS' build/rts-construction-test.log
          if grep -Ei 'SCRIPT ERROR|Parse Error|ERROR:' build/rts-construction-test.log; then
            exit 1
          fi
      - name: Test factory economy, queues and eleven-unit army
        shell: bash
        run: |
          set -Eeuo pipefail
          timeout 90s godot --headless --path client res://tests/test_production.tscn 2>&1 | tee build/rts-production-test.log
          grep -q 'RTS_PRODUCTION_TEST_PASS' build/rts-production-test.log
          if grep -Ei 'SCRIPT ERROR|Parse Error|ERROR:' build/rts-production-test.log; then
            exit 1
          fi
      - name: Test large map bounds, optional supplies and native minimap
        shell: bash
        run: |
          set -Eeuo pipefail
          timeout 45s godot --headless --path client res://tests/test_large_map.tscn 2>&1 | tee build/rts-large-map-test.log
          grep -q 'RTS_LARGE_MAP_TEST_PASS' build/rts-large-map-test.log
          if grep -Ei 'SCRIPT ERROR|Parse Error|ERROR:' build/rts-large-map-test.log; then
            exit 1
          fi
      - name: Test Lyra Voss rig, menu, lab and RTS motions
        shell: bash
        run: |
          set -Eeuo pipefail
          timeout 120s godot --headless --path client res://tests/test_lyra_voss_rig.tscn 2>&1 | tee build/lyra-rig-test.log
          grep -q 'LYRA_RIG_TEST_PASS' build/lyra-rig-test.log
          if grep -Ei 'SCRIPT ERROR|Parse Error|ERROR:' build/lyra-rig-test.log; then
            exit 1
          fi
      - name: Smoke-test orbital screen and landing scene
        shell: bash
        run: |
          set -Eeuo pipefail
          godot --headless --path client --quit-after 15 2>&1 | tee build/menu-smoke.log
          godot --headless --path client res://scenes/operation.tscn --quit-after 15 2>&1 | tee build/landing-smoke.log
          if grep -Ei 'SCRIPT ERROR|Parse Error|ERROR:' build/menu-smoke.log build/landing-smoke.log build/world-smoke.log; then
            exit 1
          fi
      - name: Create RTS-only debug signing key if missing
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          mkdir -p "$HOME/.android"
          KEY="$HOME/.android/reina-rts-debug.keystore"
          if [ ! -s "$KEY" ]; then
            keytool -genkeypair -keystore "$KEY" -storepass android -keypass android \
              -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 3650 \
              -dname 'CN=REINA RTS DEBUG, OU=CI, O=DEAD SIGNAL, C=AT' -noprompt
          fi
          chmod 600 "$KEY"
      - name: Export Android ARM64 APK
        shell: bash
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          set -Eeuo pipefail
          export GODOT_ANDROID_KEYSTORE_DEBUG_PATH="$HOME/.android/reina-rts-debug.keystore"
          mkdir -p client/build
          godot --headless --path client --export-debug Android build/NEKO_DEAD_SIGNAL-debug.apk 2>&1 | tee build/godot-export.log
          test -s client/build/NEKO_DEAD_SIGNAL-debug.apk
          "$ANDROID_HOME/build-tools/36.1.0/apksigner" verify client/build/NEKO_DEAD_SIGNAL-debug.apk
          sha256sum client/build/NEKO_DEAD_SIGNAL-debug.apk | tee client/build/SHA256SUMS
      - name: Prepare tester APK
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p build/tester-bundle
          cp client/build/NEKO_DEAD_SIGNAL-debug.apk build/tester-bundle/NEKO_DEAD_SIGNAL-0.0.28-debug.apk
      - name: Publish tester APK
        uses: actions/upload-artifact@v4
        with:
          name: neko-dead-signal-debug-${{ github.run_number }}
          path: build/tester-bundle/
          retention-days: 14
          if-no-files-found: error
      - name: Preserve CI diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neko-dead-signal-ci-logs-${{ github.run_number }}
          path: |
            client/build/SHA256SUMS
            build/godot-*.log
            build/*-smoke.log
            build/rts-*-test.log
            build/lyra-rig-test.log
          retention-days: 14
          if-no-files-found: warn
