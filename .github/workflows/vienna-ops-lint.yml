name: Vienna operations script lint

on:
  push:
    branches: [main]
    paths:
      - 'ops/vienna/*.sh'
      - '.github/workflows/vienna-ops-lint.yml'
  pull_request:
    branches: [main]
    paths:
      - 'ops/vienna/*.sh'
      - '.github/workflows/vienna-ops-lint.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate Vienna Bash syntax without executing host changes
        run: |
          set -Eeuo pipefail
          for script in ops/vienna/*.sh; do
            bash -n "$script"
          done
          echo 'VIENNA_BASH_SYNTAX_PASS'
