name: Repository structure
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  structure:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check source layout
        run: bash scripts/verify-layout.sh
      - name: Check repository docs, release metadata and safe deployment staging
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v
