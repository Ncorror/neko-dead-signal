name: Godot headless validation

on:
  pull_request:
  push:
    branches:
      - main
      - feat/first-landing-prototype

permissions:
  contents: read

jobs:
  godot-import:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Download official Godot 4.7.2 Linux editor
        shell: bash
        run: |
          set -Eeuo pipefail
          curl --retry 3 -fL 'https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip' -o /tmp/godot.zip
          mkdir -p /tmp/godot
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --version
      - name: Import project and validate scripts
        shell: bash
        run: |
          set -Eeuo pipefail
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path client --editor --quit 2>&1 | tee godot-import.log
      - name: Run orbital selection and operation smoke tests
        shell: bash
        run: |
          set -Eeuo pipefail
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path client --quit-after 5 2>&1 | tee godot-menu.log
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path client res://scenes/operation.tscn --quit-after 5 2>&1 | tee godot-operation.log
          if grep -E '(SCRIPT ERROR|Parse Error|ERROR:)' godot-import.log godot-menu.log godot-operation.log; then
            echo "Godot emitted error logs"; exit 1
          fi
      - name: Preserve logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: godot-headless-logs
          path: godot-*.log
          if-no-files-found: ignore
          retention-days: 7
