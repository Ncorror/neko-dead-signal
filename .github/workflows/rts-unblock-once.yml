name: One-shot RTS stale CI cancellation

on:
  push:
    branches: [feat/rts-squads-grid-pathfinding]
    paths: ['.github/workflows/rts-unblock-once.yml']

permissions:
  actions: write
  contents: read

jobs:
  cancel-stale:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Cancel only the known hung Godot regression workflow
        shell: bash
        run: |
          set -Eeuo pipefail
          REPO="$GITHUB_REPOSITORY"
          OLD=41481209792
          current=$(gh api "repos/$REPO/actions/runs/$OLD" --jq '.status')
          echo "Old workflow state: $current"
          if [[ "$current" == in_progress || "$current" == queued || "$current" == pending ]]; then
            gh api --method POST "repos/$REPO/actions/runs/$OLD/cancel"
            echo "Requested cancellation of stale workflow $OLD"
          fi
